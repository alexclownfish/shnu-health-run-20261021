<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>悠湃体育 · 暖橙靛蓝 UI 设计预览</title>
  <style>/* SOURCE_STYLES */</style>
  <style>/* PREVIEW_STYLES */</style>
</head>
<body>
  <header class="review-header">
    <div class="review-brand"><i data-lucide="footprints"></i><div><strong>悠湃体育 / PATCHWALK</strong><span>暖橙靛蓝 · UI 配色提案</span></div></div>
    <div class="review-meta"><span>DESIGN REVIEW</span><span>V1 · 2026.09</span></div>
  </header>
  <main class="review-main">
    <section class="review-controls" aria-label="设计预览选项">
      <nav id="page-picker" class="page-picker" aria-label="页面选择"></nav>
      <div class="review-fields">
        <label>路线进度<select id="progress-picker"><option value="0">0 / 3 · 未开始</option><option value="1">1 / 3 · 进行中</option><option value="3">3 / 3 · 已完成</option></select></label>
        <label>扫码状态<select id="scan-picker"><option value="idle">等待扫码</option><option value="scanning">扫码中</option><option value="success">扫码成功</option><option value="error">点位不匹配</option><option value="cancel">取消扫码</option></select></label>
        <label>照片状态<select id="photo-picker"><option value="idle">未选择</option><option value="selected">已选择</option><option value="saved">保存成功</option></select></label>
      </div>
    </section>
    <section class="swatches" aria-label="主题色板">
      <div><span style="background:#F76B2B"></span><strong>活动橙</strong><code>#F76B2B</code></div>
      <div><span style="background:#5664C2"></span><strong>行动靛蓝</strong><code>#5664C2</code></div>
      <div><span style="background:#3F4B9F"></span><strong>深靛蓝</strong><code>#3F4B9F</code></div>
      <div><span style="background:#FFD34E"></span><strong>能量黄</strong><code>#FFD34E</code></div>
      <div><span style="background:#F15B68"></span><strong>珊瑚粉</strong><code>#F15B68</code></div>
      <div><span style="background:#FFF8F0"></span><strong>暖米白</strong><code>#FFF8F0</code></div>
    </section>
    <section id="screens" class="screens" aria-label="小程序页面预览" aria-live="polite"></section>
    <footer class="review-footer"><span>独立视觉预览，不执行扫码、存储或上传。地图背景为示意，折线来自现有 GPX；示例照片为本地插画。</span><a href="../visual-direction.md">视觉规范<i data-lucide="arrow-up-right"></i></a></footer>
  </main>
  <script>/* LUCIDE_SOURCE */</script>
  <script>/* PREVIEW_DATA */</script>
  <script>/* PREVIEW_SCRIPT */</script>
</body>
</html>
